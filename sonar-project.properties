# SonarCloud configuration
sonar.projectKey=rhema-systems_RHEMA-ERP
sonar.organization=rhema-systems

# Project metadata
sonar.projectName=RHEMA-ERP
sonar.projectVersion=1.0

# Source directories
sonar.sources=src,frontend/src
sonar.tests=tests,frontend/tests

# Language configuration
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/*.generated.cs,**/Migrations/**,frontend/.next/**,frontend/out/**,**/*.min.js,**/*.min.css

# Test exclusions
sonar.test.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Coverage exclusions
sonar.coverage.exclusions=**/Program.cs,**/Startup.cs,**/Migrations/**,**/*.generated.cs,frontend/src/components/ui/**,frontend/src/lib/**

# Language specific settings
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.xunit.reportsPaths=**/TestResults.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info