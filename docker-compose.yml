version: '3.8'

services:
  erpsystem-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:80"
      - "5001:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ASPNETCORE_Kestrel__Certificates__Default__Password=password
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetcore-https-api.pfx
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ErpSystemDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true;
      - ConnectionStrings__Redis=redis:6379
      - FileVirusScan__ClamAv__Host=clamav
      - FileVirusScan__ClamAv__Port=3310
    volumes:
      - ~/.aspnet/https:/https:ro
      - ./data:/app/data
    depends_on:
      - sqlserver
      - redis
      - clamav
    networks:
      - erp-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - erp-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - erp-network
    command: redis-server --appendonly yes

  clamav:
    image: clamav/clamav:stable
    environment:
      - CLAMAV_NO_MILTERD=true
    volumes:
      - clamav-data:/var/lib/clamav
    networks:
      - erp-network
    restart: unless-stopped

volumes:
  sqlserver-data:
  redis-data:
  clamav-data:

networks:
  erp-network:
    driver: bridge
