<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Assets API</title>
</head>
<body>
    <h1>Test Assets API</h1>
    <button onclick="testAssetsAPI()">Test Assets API</button>
    <button onclick="testCategoriesAPI()">Test Categories API</button>
    <div id="results"></div>

    <script>
        async function testAssetsAPI() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = 'Loading...';
            
            try {
                // Test without authentication first
                const response = await fetch('http://localhost:5000/api/maintenance/assets?page=1&pageSize=10', {
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                if (response.status === 401) {
                    resultsDiv.innerHTML = '<h2>Unauthorized - Need Authentication</h2><p>This confirms the endpoint exists but requires auth.</p>';
                    return;
                }
                
                const data = await response.json();
                console.log('Response data:', data);
                
                resultsDiv.innerHTML = `
                    <h2>API Response (Status: ${response.status})</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                
            } catch (error) {
                console.error('Error:', error);
                resultsDiv.innerHTML = `
                    <h2>Error</h2>
                    <p>${error.message}</p>
                `;
            }
        }
        
        async function testCategoriesAPI() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = 'Loading categories...';
            
            try {
                const response = await fetch('http://localhost:5000/api/maintenance/asset-categories', {
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log('Categories response status:', response.status);
                
                if (response.status === 401) {
                    resultsDiv.innerHTML = '<h2>Unauthorized - Need Authentication</h2><p>This confirms the endpoint exists but requires auth.</p>';
                    return;
                }
                
                const data = await response.json();
                console.log('Categories response data:', data);
                
                resultsDiv.innerHTML = `
                    <h2>Categories API Response (Status: ${response.status})</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                
            } catch (error) {
                console.error('Categories Error:', error);
                resultsDiv.innerHTML = `
                    <h2>Categories Error</h2>
                    <p>${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
