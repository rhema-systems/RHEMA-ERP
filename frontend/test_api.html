<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>API Testing</h1>
    <div id="results"></div>
    <script>
        const baseUrl = 'http://localhost:5000/api';
        const resultsDiv = document.getElementById('results');
        
        async function testEndpoint(name, url, needsAuth = false) {
            try {
                const headers = {
                    'Content-Type': 'application/json'
                };
                
                // Add auth token if needed
                if (needsAuth) {
                    const token = localStorage.getItem('authToken');
                    if (token) {
                        headers['Authorization'] = `Bearer ${token}`;
                    }
                }
                
                const response = await fetch(url, { headers });
                const text = await response.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch {
                    data = text;
                }
                
                resultsDiv.innerHTML += `
                    <h3>${name}</h3>
                    <p><strong>Status:</strong> ${response.status}</p>
                    <p><strong>URL:</strong> ${url}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <hr>
                `;
            } catch (error) {
                resultsDiv.innerHTML += `
                    <h3>${name} - ERROR</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p><strong>URL:</strong> ${url}</p>
                    <hr>
                `;
            }
        }
        
        // Test endpoints
        testEndpoint('Assets', `${baseUrl}/maintenance/assets`, true);
        testEndpoint('Work Order Types', `${baseUrl}/maintenance/work-order-types/active`, true);
        testEndpoint('Priority Levels (no auth)', `${baseUrl}/maintenance/priority-levels/active`, false);
        testEndpoint('Priority Levels (with auth)', `${baseUrl}/maintenance/priority-levels/active`, true);
    </script>
</body>
</html>
