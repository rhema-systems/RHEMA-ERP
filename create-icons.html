<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Icon Generator</title>
</head>
<body>
    <canvas id="canvas192" width="192" height="192" style="display: none;"></canvas>
    <canvas id="canvas512" width="512" height="512" style="display: none;"></canvas>
    
    <script>
    // Function to create icon
    function createIcon(size) {
        const canvas = document.getElementById(`canvas${size}`);
        const ctx = canvas.getContext('2d');
        
        // Fill background
        ctx.fillStyle = '#2563eb';
        ctx.fillRect(0, 0, size, size);
        
        // Add rounded rectangle
        const margin = size * 0.1;
        const rectSize = size - (margin * 2);
        const radius = size * 0.05;
        
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(margin, margin, rectSize, rectSize, radius);
        ctx.fill();
        
        // Add ERP text
        ctx.fillStyle = '#2563eb';
        ctx.font = `bold ${size * 0.15}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('ERP', size/2, size/2 - size * 0.05);
        
        // Add subtitle
        ctx.font = `${size * 0.08}px Arial`;
        ctx.fillText('SYSTEM', size/2, size/2 + size * 0.08);
        
        return canvas.toDataURL('image/png');
    }
    
    // Create icons
    const icon192 = createIcon(192);
    const icon512 = createIcon(512);
    
    // Download function
    function downloadIcon(dataUrl, filename) {
        const link = document.createElement('a');
        link.download = filename;
        link.href = dataUrl;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
    
    // Auto-download icons
    setTimeout(() => {
        downloadIcon(icon192, 'icon-192.png');
        setTimeout(() => {
            downloadIcon(icon512, 'icon-512.png');
        }, 1000);
    }, 1000);
    </script>
    
    <h1>PWA Icon Generator</h1>
    <p>Icons will be automatically downloaded...</p>
    <p>Or right-click and save as:</p>
    <div>
        <img src="" id="preview192" alt="192x192 icon">
        <img src="" id="preview512" alt="512x512 icon">
    </div>
    
    <script>
    document.getElementById('preview192').src = icon192;
    document.getElementById('preview512').src = icon512;
    </script>
</body>
</html>
