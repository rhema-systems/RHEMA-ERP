version: 2
updates:
  # .NET dependencies
  - package-ecosystem: "nuget"
    directory: "/src/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    reviewers:
      - "rhema-systems/erp-maintainers"
    assignees:
      - "rhema-systems/erp-maintainers"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "dotnet"
    groups:
      microsoft-packages:
        patterns:
          - "Microsoft.*"
          - "System.*"
      security-updates:
        patterns:
          - "*"
        dependency-type: "security-update"
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major version updates for critical packages
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]

  # Frontend dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/frontend/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
    open-pull-requests-limit: 10
    reviewers:
      - "rhema-systems/erp-maintainers"
    assignees:
      - "rhema-systems/erp-maintainers"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
      - "npm"
    groups:
      react-ecosystem:
        patterns:
          - "react*"
          - "@types/react*"
      nextjs-ecosystem:
        patterns:
          - "next*"
          - "@next/*"
      ui-libraries:
        patterns:
          - "@radix-ui/*"
          - "tailwindcss*"
          - "lucide-react"
      dev-dependencies:
        patterns:
          - "*"
        dependency-type: "development"
      security-updates:
        patterns:
          - "*"
        dependency-type: "security-update"
    ignore:
      # Ignore major version updates for core framework packages
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/src/ErpSystem.Api/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
    open-pull-requests-limit: 5
    reviewers:
      - "rhema-systems/erp-maintainers"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
      - "backend"

  - package-ecosystem: "docker"
    directory: "/frontend/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
    open-pull-requests-limit: 5
    reviewers:
      - "rhema-systems/erp-maintainers"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
      - "frontend"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "06:00"
    open-pull-requests-limit: 5
    reviewers:
      - "rhema-systems/erp-maintainers"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci-cd"
    groups:
      actions-group:
        patterns:
          - "actions/*"
          - "github/codeql-action"