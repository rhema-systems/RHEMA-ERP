name: Finance Integration Gate

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/finance-integration-gate.yml"
      - "src/ErpSystem.Api/Controllers/Finance/**"
      - "src/ErpSystem.Api/Services/Finance/**"
      - "src/ErpSystem.Core/DTOs/Finance/**"
      - "src/ErpSystem.Core/Entities/Finance/**"
      - "src/ErpSystem.Core/Finance/Integration/**"
      - "src/ErpSystem.Core/Interfaces/Finance/**"
      - "src/ErpSystem.Core/Services/Finance/**"
      - "src/ErpSystem.Core/Services/Procurement/ProcurementSupplierOnboardingTokenService.cs"
      - "src/ErpSystem.Core/Services/Inventory/**"
      - "src/ErpSystem.Data/Configuration/Finance/**"
      - "src/ErpSystem.Data/Migrations/**"
      - "src/ErpSystem.Data/Seeders/FinanceDataSeeder.cs"
      - "tests/ErpSystem.Api.Tests/Services/Finance/**"
      - "src/ErpSystem.Core/Services/HR/Finance/**"
      - "tests/ErpSystem.Api.Tests/Services/HR/HrFinancePosting*.cs"
      - "tests/ErpSystem.Core.Tests/Services/Procurement/ProcurementSupplierOnboardingTokenServiceTests.cs"
      - "tests/ErpSystem.Core.Tests/Services/Inventory/**"
  workflow_dispatch:

# A new commit supersedes an older run for the same PR. This keeps the SQL Server service and the
# repository's memory-heavy merged build from consuming runner capacity for obsolete revisions.
concurrency:
  group: finance-integration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  finance-contracts:
    name: Finance consumer and SQL Server contracts
    # Keep the gate on the image it is verified against instead of inheriting the
    # announced ubuntu-latest migration to Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: FinanceContractGate2026!
          MSSQL_PID: Developer
        ports:
          - 1433:1433

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The repository contains a legacy gitlink without a .gitmodules entry.
          # This read-only gate does not need persisted credentials, and disabling
          # them avoids checkout's post-job recursive submodule cleanup.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Wait for isolated SQL Server
        shell: bash
        run: |
          container_id="$(docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest | head -n 1)"
          if [ -z "$container_id" ]; then
            echo "The SQL Server service container was not created."
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if docker exec "$container_id" /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P 'FinanceContractGate2026!' -C -Q 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi

            if docker exec "$container_id" /opt/mssql-tools/bin/sqlcmd \
              -S localhost -U sa -P 'FinanceContractGate2026!' -Q 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi

            echo "Waiting for SQL Server ($attempt/30)..."
            sleep 2
          done

          echo "SQL Server did not become ready."
          docker logs "$container_id"
          exit 1

      - name: Restore focused test projects
        run: |
          dotnet restore tests/ErpSystem.Api.Tests/ErpSystem.Api.Tests.csproj
          dotnet restore tests/ErpSystem.Core.Tests/ErpSystem.Core.Tests.csproj

      - name: Build Finance API test assembly once
        # These contracts use EnsureCreated from the current EF model; they do not enumerate or apply
        # migrations. TdcFastEfBuild therefore omits generated historical target models while normal
        # application, migration-tooling and release builds retain the complete migration assembly.
        run: |
          dotnet build tests/ErpSystem.Api.Tests/ErpSystem.Api.Tests.csproj \
            --configuration Debug \
            --no-restore \
            --maxcpucount:1 \
            /p:TdcFastEfBuild=true \
            /p:UseSharedCompilation=false \
            /p:RunAnalyzers=false \
            /p:RunAnalyzersDuringBuild=false

      - name: Run Finance-owned consumer contracts
        shell: bash
        run: |
          api_filter='FullyQualifiedName~FinancePostingEngineTests|FullyQualifiedName~ApPaymentPostingMigrationTests.ApprovedApPayment_ShouldPostThroughFinancePostingEngineAndCreateAuditEvent|FullyQualifiedName~ApPaymentPostingMigrationTests.CrossCurrencyApPayment_ShouldPostLineScopedDiscountAndWhtAtFrozenFunctionalValues|FullyQualifiedName~ApPaymentPostingMigrationTests.ForeignSupplierAdvance_ShouldApplyAtFrozenLotAndCurrentInvoiceRatesThenReverseImmutably|FullyQualifiedName~ArReceiptPostingMigrationTests.ApprovedArReceipt_ShouldPostThroughFinancePostingEngineAndCreateAuditEvent|FullyQualifiedName~ArReceiptPostingMigrationTests.CrossCurrencyArReceipt_ShouldPostEveryDeductionAtItsFrozenFunctionalValue|FullyQualifiedName~ArReceiptPostingMigrationTests.ForeignCustomerAdvance_ShouldApplyAtFrozenLotAndCurrentInvoiceRatesThenReverseImmutably|FullyQualifiedName~CrossCurrencySettlementCalculatorTests.LineScopedDeductions_ShouldRetainIndependentlyRoundedFunctionalEvidence|FullyQualifiedName~LineScopedCrossCurrencyDeductionMigrationTests.Migration_ShouldAddAndRemoveEveryApArDeductionEvidenceColumn|FullyQualifiedName~E2E012InventoryAdjustmentFinancePostingTests|FullyQualifiedName~InventoryValuationFinancePostingTests|FullyQualifiedName~ProcurementFinanceReconciliationTests.Reconciliation_ShouldComposeExistingCommitmentReceiptApGlRetentionAndMilestones|FullyQualifiedName~FinanceIntegrationContractFoundationTests|FullyQualifiedName~FixedAssetDisposalFoundationTests.CreditSaleCreatesLinkedArInvoiceAgainstTheDisposalClearingAccount|FullyQualifiedName~FixedAssetDisposalFoundationTests.ImmediateSaleCreatesAndPostsReceiptAllocatedToLinkedInvoice|FullyQualifiedName~FixedAssetDisposalSettlementMigrationTests|FullyQualifiedName~HrFinancePostingAdapterTests|FullyQualifiedName~HrFinancePostingCatalogueTests'
          dotnet test tests/ErpSystem.Api.Tests/ErpSystem.Api.Tests.csproj \
            --configuration Debug \
            --no-build \
            --filter "$api_filter" \
            --logger "trx;LogFileName=finance-consumer-contracts.trx" \
            --results-directory artifacts/finance-test-results

      - name: Build and run Procurement-to-Finance contracts
        shell: bash
        run: |
          # The Core test project contains unrelated legacy compile debt. Its existing focused-build
          # mode isolates the active supplier-onboarding contract without hiding production builds,
          # because the API assembly and all project references were compiled in the preceding step.
          dotnet build tests/ErpSystem.Core.Tests/ErpSystem.Core.Tests.csproj \
            --configuration Debug \
            --no-restore \
            --maxcpucount:1 \
            /p:BuildProjectReferences=false \
            /p:TdcFocusedTestBuild=true \
            /p:TdcFocusedTestFile=Services/Procurement/ProcurementSupplierOnboardingTokenServiceTests.cs \
            /p:UseSharedCompilation=false \
            /p:RunAnalyzers=false \
            /p:RunAnalyzersDuringBuild=false

          procurement_filter='FullyQualifiedName~ProcurementSupplierOnboardingTokenServiceTests.PaidTokenRequiresTrustedVerificationBeforePostingAndActivation|FullyQualifiedName~ProcurementSupplierOnboardingTokenServiceTests.FinanceReconciliationRequiresAnIndependentActorAndIsReplaySafe|FullyQualifiedName~ProcurementSupplierOnboardingTokenServiceTests.ApplicantPaymentUsesSessionLineageAndDoesNotImpersonateAdministrator'
          dotnet test tests/ErpSystem.Core.Tests/ErpSystem.Core.Tests.csproj \
            --configuration Debug \
            --no-build \
            --filter "$procurement_filter" \
            --logger "trx;LogFileName=finance-procurement-contracts.trx" \
            --results-directory artifacts/finance-test-results

      - name: Build and run Inventory-to-Finance contract
        shell: bash
        run: |
          dotnet build tests/ErpSystem.Core.Tests/ErpSystem.Core.Tests.csproj \
            --configuration Debug \
            --no-restore \
            --maxcpucount:1 \
            /p:BuildProjectReferences=false \
            /p:TdcFocusedTestBuild=true \
            /p:TdcFocusedTestFile=Services/Inventory/E2E012CycleCountFinanceLifecycleTests.cs \
            /p:UseSharedCompilation=false \
            /p:RunAnalyzers=false \
            /p:RunAnalyzersDuringBuild=false

          dotnet test tests/ErpSystem.Core.Tests/ErpSystem.Core.Tests.csproj \
            --configuration Debug \
            --no-build \
            --filter "FullyQualifiedName~E2E012CycleCountFinanceLifecycleTests.Counter_reviews_corrects_then_submits_for_independent_approvals_and_finance_posting" \
            --logger "trx;LogFileName=finance-inventory-contract.trx" \
            --results-directory artifacts/finance-test-results

      - name: Run real SQL Server Finance contracts
        env:
          RHEMA_TEST_SQLSERVER: "Server=localhost,1433;Database=master;User Id=sa;Password=FinanceContractGate2026!;Encrypt=True;TrustServerCertificate=True"
        run: |
          dotnet test tests/ErpSystem.Api.Tests/ErpSystem.Api.Tests.csproj \
            --configuration Debug \
            --no-build \
            --filter "FullyQualifiedName~JournalBatchSqlServerReleaseGateTests" \
            --logger "trx;LogFileName=finance-sql-server-contracts.trx" \
            --results-directory artifacts/finance-test-results

      - name: Verify every required contract executed
        shell: bash
        run: |
          assert_trx_count() {
            local trx="$1"
            local minimum="$2"
            local label="$3"

            if [ ! -f "$trx" ]; then
              echo "$label did not produce a TRX result."
              exit 1
            fi

            if grep -q 'outcome="NotExecuted"' "$trx"; then
              echo "$label skipped at least one required contract."
              cat "$trx"
              exit 1
            fi

            local counters
            counters="$(grep -o '<Counters[^>]*/>' "$trx" | tail -n 1)"
            local total
            local executed
            local passed
            total="$(sed -n 's/.*total="\([0-9][0-9]*\)".*/\1/p' <<<"$counters")"
            executed="$(sed -n 's/.*executed="\([0-9][0-9]*\)".*/\1/p' <<<"$counters")"
            passed="$(sed -n 's/.*passed="\([0-9][0-9]*\)".*/\1/p' <<<"$counters")"

            if [ -z "$total" ] || [ -z "$executed" ] || [ -z "$passed" ] || \
               [ "$total" -lt "$minimum" ] || [ "$executed" -ne "$total" ] || \
               [ "$passed" -ne "$total" ]; then
              echo "$label expected at least $minimum contracts, with every discovered contract executed and passing."
              cat "$trx"
              exit 1
            fi
          }

          assert_trx_count "artifacts/finance-test-results/finance-consumer-contracts.trx" 70 "Finance consumer gate"
          assert_trx_count "artifacts/finance-test-results/finance-procurement-contracts.trx" 3 "Procurement-to-Finance gate"
          assert_trx_count "artifacts/finance-test-results/finance-inventory-contract.trx" 1 "Inventory-to-Finance gate"
          assert_trx_count "artifacts/finance-test-results/finance-sql-server-contracts.trx" 5 "SQL Server Finance gate"

      - name: Upload Finance contract results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: finance-integration-contract-results
          path: artifacts/finance-test-results/
          retention-days: 14
