name: 🔒 Security Scanning

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM UTC
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'frontend/**'
      - '**/Dockerfile'
      - '**/*.csproj'
      - '**/package.json'
  pull_request:
    branches: [ master ]
  workflow_dispatch: # Manual trigger

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '18.x'

jobs:
  # Job 1: SAST (Static Application Security Testing)
  sast-scan:
    name: 🔍 SAST Security Scan
    runs-on: ubuntu-latest
    
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # .NET Security Scanning
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 Restore .NET dependencies
      run: |
        dotnet restore

    - name: 🔒 Run .NET Security Audit
      run: |
        dotnet list package --vulnerable --include-transitive 2>&1 | tee security-audit.txt
        
        # Check if vulnerabilities were found
        if grep -q "has the following vulnerable packages" security-audit.txt; then
          echo "::warning::Vulnerable packages detected"
          cat security-audit.txt
        fi

    - name: 🔍 Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: 'csharp,javascript'
        queries: security-extended,security-and-quality

    - name: 🏧️ Autobuild for CodeQL
      uses: github/codeql-action/autobuild@v3

    - name: 🔒 Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:csharp,javascript"

    # Node.js Security Scanning
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: 📦 Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: 🔒 Run npm audit
      run: |
        cd frontend
        npm audit --audit-level=moderate --json > npm-audit.json || true
        npm audit --audit-level=moderate || true

    - name: 🔍 Run Snyk security scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=medium --file=frontend/package.json
      continue-on-error: true

    # OWASP Dependency Check
    - name: 🛡️ Run OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'ERP-System'
        path: '.'
        format: 'SARIF'
        args: >
          --enableRetired
          --enableExperimental
          --failOnCVSS 7

    - name: 📤 Upload OWASP results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('reports/dependency-check-report.sarif') != ''
      with:
        sarif_file: reports/dependency-check-report.sarif
      continue-on-error: true

  # Job 2: Secret Scanning
  secret-scan:
    name: 🔐 Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔍 Run TruffleHog OSS
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
        extra_args: --debug --only-verified
      continue-on-error: true

    - name: 🔍 Basic secret pattern scanning
      run: |
        echo "Scanning for common secret patterns..."
        
        # Create a simple secret pattern scanner
        cat > secret_patterns.txt << 'EOF'
        password.*=.*["'].*["']
        api.*key.*[=:].*["'].*["']
        token.*[=:].*["'].*["']
        secret.*[=:].*["'].*["']
        connection.*string.*[=:].*["'].*["']
        aws.*access.*key.*[=:].*["'].*["']
        aws.*secret.*key.*[=:].*["'].*["']
        EOF
        
        # Scan for patterns (excluding test and mock files)
        echo "Checking for potential secrets..."
        find . -type f \( -name "*.cs" -o -name "*.js" -o -name "*.ts" -o -name "*.json" -o -name "*.yml" -o -name "*.yaml" \) \
          ! -path "./node_modules/*" \
          ! -path "./.git/*" \
          ! -path "*/test*" \
          ! -path "*/mock*" \
          ! -name "*test*" \
          ! -name "*mock*" \
          -exec grep -iHn -f secret_patterns.txt {} + || echo "No obvious secrets found"
      continue-on-error: true

  # Job 3: Container Security Scanning
  container-security:
    name: 🐳 Container Security Scan
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        dockerfile: 
          - src/ErpSystem.Api/Dockerfile
          - frontend/Dockerfile

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🏗️ Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ contains(matrix.dockerfile, 'frontend') && 'frontend' || '.' }}
        file: ${{ matrix.dockerfile }}
        push: false
        tags: security-scan:latest
        outputs: type=docker,dest=/tmp/image.tar

    - name: 🔒 Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        input: /tmp/image.tar
        format: 'sarif'
        output: 'trivy-results-${{ matrix.dockerfile }}.sarif'

    - name: 📤 Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('trivy-results-${{ matrix.dockerfile }}.sarif') != ''
      with:
        sarif_file: 'trivy-results-${{ matrix.dockerfile }}.sarif'
      continue-on-error: true

    - name: 🔍 Run Hadolint (Dockerfile linter)
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: ${{ matrix.dockerfile }}
        format: sarif
        output-file: hadolint-results-${{ matrix.dockerfile }}.sarif

    - name: 📤 Upload Hadolint scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('hadolint-results-${{ matrix.dockerfile }}.sarif') != ''
      with:
        sarif_file: 'hadolint-results-${{ matrix.dockerfile }}.sarif'
      continue-on-error: true

  # Job 4: Infrastructure Security
  infrastructure-security:
    name: 🏗️ Infrastructure Security
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔍 Run Checkov - Infrastructure as Code Scanner
      uses: bridgecrewio/checkov-action@master
      with:
        directory: .
        framework: dockerfile,secrets
        output_format: sarif
        output_file_path: checkov-results.sarif

    - name: 📤 Upload Checkov scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('checkov-results.sarif') != ''
      with:
        sarif_file: checkov-results.sarif
      continue-on-error: true

    - name: 🔒 Scan Docker Compose files
      run: |
        # Check for security issues in Docker Compose files
        find . -name "*.yml" -o -name "*.yaml" | grep -E "(docker-compose|compose)" | while read file; do
          echo "Scanning $file for security issues..."
          
          # Check for exposed ports
          if grep -q "ports:" "$file" && grep -q "0\.0\.0\.0:" "$file"; then
            echo "::warning file=$file::Potentially dangerous port binding to 0.0.0.0"
          fi
          
          # Check for default passwords
          if grep -qi "password.*admin\|password.*123\|password.*password" "$file"; then
            echo "::warning file=$file::Potential default password detected"
          fi
          
          # Check for privileged containers
          if grep -q "privileged: true" "$file"; then
            echo "::warning file=$file::Privileged container detected"
          fi
          
          # Check for host network mode
          if grep -q "network_mode: host" "$file"; then
            echo "::warning file=$file::Host network mode detected - potential security risk"
          fi
        done

  # Job 5: API Security Testing
  api-security:
    name: 🌐 API Security Testing
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: TestPassword123!
          MSSQL_PID: Express
        ports:
          - 1433:1433

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 🏗️ Build and start API
      run: |
        cd src
        dotnet build --configuration Release
        dotnet run --project ErpSystem.Api --urls http://localhost:5000 &
        sleep 30
      env:
        ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=ErpSecurityTest;User Id=sa;Password=TestPassword123!;MultipleActiveResultSets=true;TrustServerCertificate=true;"
        ConnectionStrings__Redis: "localhost:6379"
        ASPNETCORE_ENVIRONMENT: "Testing"

    - name: 🔒 Wait for API to be ready
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:5000/health; do sleep 2; done'

    - name: 🕷️ Run OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: 'http://localhost:5000'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a -j -m 10 -T 60'

    - name: 🔍 Run REST API Security Testing
      run: |
        # Basic API security checks
        echo "Running API security tests..."
        
        # Test for common vulnerabilities
        curl -X GET http://localhost:5000/api/../../../etc/passwd || echo "Path traversal test completed"
        curl -X GET "http://localhost:5000/api/health'; DROP TABLE Users; --" || echo "SQL injection test completed"
        curl -X GET http://localhost:5000/api/health -H "X-Forwarded-For: <script>alert('xss')</script>" || echo "XSS header test completed"
        
        # Check security headers
        curl -I http://localhost:5000/api/health | grep -E "(X-Content-Type-Options|X-Frame-Options|X-XSS-Protection|Strict-Transport-Security)"

  # Job 6: License Compliance Scanning
  license-scan:
    name: 📄 License Compliance Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: 📋 Scan .NET licenses
      run: |
        cd src
        dotnet restore
        
        # Install license scanner (if available)
        # dotnet tool install --global license-checker
        
        # Alternative: manual license check
        dotnet list package --include-transitive > packages.txt
        echo "### .NET Package Licenses" >> $GITHUB_STEP_SUMMARY
        echo "Please review the following packages for license compliance:" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat packages.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

    - name: 📋 Scan Node.js licenses
      run: |
        cd frontend
        npm ci
        npm install -g license-checker
        
        license-checker --onlyAllow "MIT;BSD;Apache;ISC;Unlicense;WTFPL" --excludePrivatePackages > ../license-report.txt || true
        
        echo "### Node.js License Report" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat ../license-report.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # Job 7: Security Summary & Reporting
  security-summary:
    name: 📊 Security Summary
    runs-on: ubuntu-latest
    needs: [sast-scan, secret-scan, container-security, infrastructure-security, license-scan]
    if: always()
    
    steps:
    - name: 📊 Generate Security Report
      run: |
        echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Scan Type | Status | Details |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|---------|---------|" >> $GITHUB_STEP_SUMMARY
        echo "| SAST Scan | ${{ needs.sast-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} | Static Application Security Testing |" >> $GITHUB_STEP_SUMMARY
        echo "| Secret Scan | ${{ needs.secret-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} | Credential and Secret Detection |" >> $GITHUB_STEP_SUMMARY
        echo "| Container Security | ${{ needs.container-security.result == 'success' && '✅ Passed' || '❌ Failed' }} | Docker Image Vulnerability Scan |" >> $GITHUB_STEP_SUMMARY
        echo "| Infrastructure Security | ${{ needs.infrastructure-security.result == 'success' && '✅ Passed' || '❌ Failed' }} | Infrastructure as Code Security |" >> $GITHUB_STEP_SUMMARY
        echo "| License Compliance | ${{ needs.license-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} | Software License Compliance |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Review the detailed results in the Security tab of your repository." >> $GITHUB_STEP_SUMMARY

    - name: 📧 Notify security team on failures
      if: |
        needs.sast-scan.result == 'failure' || 
        needs.secret-scan.result == 'failure' || 
        needs.container-security.result == 'failure'
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#security-alerts'
        webhook_url: ${{ secrets.SECURITY_SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
        text: |
          🚨 Security scan failures detected in ${{ github.repository }}
          Please review the security findings immediately.