name: Windows VPS CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_release:
        description: Build and retain an immutable test-VPS release
        required: true
        type: boolean
        default: true
      deploy_to_test_vps:
        description: Deploy the release to the guarded Windows test VPS
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-vps-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 9.0.315
  NODE_VERSION: 24.19.0

jobs:
  vps-release-contract:
    name: Validate Windows VPS release contracts
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify migration probes, packaging, and deploy-only contracts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\vps\Test-CanonicalMigrationPreflight.ps1
          .\scripts\vps\Test-RhemaZipPackage.ps1
          .\scripts\vps\Test-RhemaReleaseArtifactFlow.ps1

  build-release:
    name: Build immutable Windows release once
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.build_release || inputs.deploy_to_test_vps)
    needs: vps-release-contract
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      release_id: ${{ steps.release.outputs.release_id }}

    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject non-master deployment candidates
        if: inputs.deploy_to_test_vps
        shell: powershell
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/master') {
            throw 'Test-VPS deployment is allowed only from the master branch.'
          }

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Node.js and locked npm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore persistent Next.js compilation cache
        uses: actions/cache@v4
        with:
          path: frontend/.next-production/cache
          key: next-vps-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-vps-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Validate protected build configuration
        shell: powershell
        env:
          SYNCFUSION_LICENSE: ${{ secrets.SYNCFUSION_LICENSE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SYNCFUSION_LICENSE)) {
            throw 'Repository secret SYNCFUSION_LICENSE is required for release construction.'
          }
          if ([string]::IsNullOrWhiteSpace('${{ vars.VPS_PUBLIC_BASE_URL }}')) {
            throw 'Repository variable VPS_PUBLIC_BASE_URL is required.'
          }

      - name: Build, package, and hash immutable release
        id: release
        shell: powershell
        env:
          SYNCFUSION_LICENSE: ${{ secrets.SYNCFUSION_LICENSE }}
          NEXT_BUILD_MAX_OLD_SPACE_SIZE_MB: 6144
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          $ErrorActionPreference = 'Stop'
          $outputRoot = Join-Path $env:RUNNER_TEMP 'rhema-vps-release'
          if (Test-Path -LiteralPath $outputRoot) {
            Remove-Item -LiteralPath $outputRoot -Recurse -Force
          }

          .\scripts\Build-RhemaRelease.ps1 `
            -Environment Test `
            -PublicBaseUrl '${{ vars.VPS_PUBLIC_BASE_URL }}' `
            -ExpectedCommit $env:GITHUB_SHA `
            -OutputDirectory $outputRoot `
            -ArchiveCompressionLevel Fastest

          $manifests = @(Get-ChildItem -LiteralPath $outputRoot `
              -Filter release-manifest.json -File -Recurse)
          if ($manifests.Count -ne 1) {
            throw "Expected one release manifest, found $($manifests.Count)."
          }
          $releaseDirectory = $manifests[0].Directory.FullName
          $manifest = Get-Content -LiteralPath $manifests[0].FullName -Raw |
            ConvertFrom-Json
          if ($manifest.commit -cne $env:GITHUB_SHA) {
            throw 'Release manifest commit differs from the workflow commit.'
          }

          $artifactName = "rhema-vps-$($manifest.releaseId)-$env:GITHUB_RUN_ATTEMPT"
          "artifact_directory=$releaseDirectory" >> $env:GITHUB_OUTPUT
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT
          "release_id=$($manifest.releaseId)" >> $env:GITHUB_OUTPUT

      - name: Upload verified release without recompressing nested ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: ${{ steps.release.outputs.artifact_directory }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  deploy-test-vps:
    name: Activate verified release on Windows test VPS
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_to_test_vps &&
      needs.build-release.result == 'success'
    needs: build-release
    runs-on: windows-latest
    timeout-minutes: 90
    environment: test-vps

    env:
      GH_TOKEN: ${{ github.token }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
      VPS_SSH_USER: ${{ vars.VPS_SSH_USER }}
      VPS_PUBLIC_BASE_URL: ${{ vars.VPS_PUBLIC_BASE_URL }}

    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js for browser smoke tests
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download the exact verified release
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-release.outputs.artifact_name }}
          path: ${{ runner.temp }}/rhema-vps-release

      - name: Configure pinned SSH identity
        id: ssh
        shell: powershell
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($entry in @{
              VPS_HOST = $env:VPS_HOST
              VPS_SSH_PORT = $env:VPS_SSH_PORT
              VPS_SSH_USER = $env:VPS_SSH_USER
              VPS_PUBLIC_BASE_URL = $env:VPS_PUBLIC_BASE_URL
              VPS_SSH_PRIVATE_KEY = $env:VPS_SSH_PRIVATE_KEY
              VPS_SSH_KNOWN_HOSTS = $env:VPS_SSH_KNOWN_HOSTS
            }.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace([string]$entry.Value)) {
              throw "Required test-VPS setting is missing: $($entry.Key)"
            }
          }

          $sshDirectory = Join-Path $env:USERPROFILE '.ssh'
          [void][IO.Directory]::CreateDirectory($sshDirectory)
          $keyPath = Join-Path $sshDirectory 'rhema_vps_ci'
          $knownHostsPath = Join-Path $sshDirectory 'known_hosts'
          $utf8 = [Text.UTF8Encoding]::new($false)
          $privateKey = $env:VPS_SSH_PRIVATE_KEY.Replace("`r`n", "`n").TrimEnd() + "`n"
          $knownHosts = $env:VPS_SSH_KNOWN_HOSTS.Replace("`r`n", "`n").TrimEnd() + "`n"
          [IO.File]::WriteAllText($keyPath, $privateKey, $utf8)
          [IO.File]::WriteAllText($knownHostsPath, $knownHosts, $utf8)
          & icacls.exe $keyPath /inheritance:r /grant:r "$env:USERNAME`:(R)" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not restrict the CI SSH private key.' }

          $keygenStartInfo = [Diagnostics.ProcessStartInfo]::new()
          $keygenStartInfo.FileName = (Get-Command ssh-keygen.exe -ErrorAction Stop).Source
          $keygenStartInfo.UseShellExecute = $false
          $keygenStartInfo.CreateNoWindow = $true
          $keygenStartInfo.RedirectStandardInput = $true
          $keygenStartInfo.RedirectStandardOutput = $true
          $keygenStartInfo.RedirectStandardError = $true
          $keygenStartInfo.Arguments = '-y -f "' + $keyPath + '"'
          $keygenProcess = [Diagnostics.Process]::new()
          $keygenProcess.StartInfo = $keygenStartInfo
          try {
            [void]$keygenProcess.Start()
            $keygenProcess.StandardInput.Close()
            $keygenOutputTask = $keygenProcess.StandardOutput.ReadToEndAsync()
            $keygenErrorTask = $keygenProcess.StandardError.ReadToEndAsync()
            $keygenProcess.WaitForExit()
            [void]$keygenOutputTask.GetAwaiter().GetResult()
            $keygenError = $keygenErrorTask.GetAwaiter().GetResult().Trim()
            if ($keygenProcess.ExitCode -ne 0) {
              throw "The configured CI SSH private key is invalid or encrypted. $keygenError"
            }
          }
          finally {
            $keygenProcess.Dispose()
          }
          "key_path=$keyPath" >> $env:GITHUB_OUTPUT

      - name: Preflight SSH connection without changing the VPS
        shell: powershell
        run: |
          $arguments = @(
            '-i', '${{ steps.ssh.outputs.key_path }}',
            '-p', $env:VPS_SSH_PORT,
            '-o', 'BatchMode=yes',
            '-o', 'IdentitiesOnly=yes',
            '-o', 'StrictHostKeyChecking=yes',
            '-o', 'ConnectTimeout=15',
            "$env:VPS_SSH_USER@$env:VPS_HOST",
            'cmd.exe /d /c exit 0'
          )
          & ssh.exe @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Pinned SSH connection to the test VPS failed.' }

      - name: Deploy immutable release with backups, migrations, rollback, and smoke tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDirectory = [IO.Path]::GetFullPath('${{ runner.temp }}/rhema-vps-release')
          .\scripts\Deploy-RhemaVps.ps1 `
            -Environment Test `
            -DeployOnly `
            -ArtifactDirectory $artifactDirectory `
            -ExpectedCommit $env:GITHUB_SHA `
            -VpsHost $env:VPS_HOST `
            -SshPort ([int]$env:VPS_SSH_PORT) `
            -SshUser $env:VPS_SSH_USER `
            -SshKeyPath '${{ steps.ssh.outputs.key_path }}' `
            -PublicBaseUrl $env:VPS_PUBLIC_BASE_URL

      - name: Retain sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vps-deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/vps-releases/deployments/**/*.json
            artifacts/vps-releases/preflights/**/*.json
          if-no-files-found: ignore
          retention-days: 30
