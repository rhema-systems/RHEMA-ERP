name: 🚀 ERP System CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: # Manual trigger

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '18.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Code Quality & Security Scanning
  code-quality:
    name: 🔍 Code Quality & Security
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis

    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 Restore dependencies
      run: |
        dotnet restore

    - name: 🔍 Run SonarCloud analysis
      uses: SonarSource/sonarcloud-github-action@master
      with:
        projectBaseDir: src
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: 🔒 Run CodeQL Analysis
      uses: github/codeql-action/init@v3
      with:
        languages: 'csharp,javascript'

    - name: 🏧️ Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: 🔒 Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  # Job 2: Backend Testing & Build
  backend-build-test:
    name: 🔧 Backend Build & Test
    runs-on: ubuntu-latest
    needs: code-quality
    
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: TestPassword123!
          MSSQL_PID: Express
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P TestPassword123! -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 Restore dependencies
      run: |
        dotnet restore

    - name: 🏧️ Build solution
      run: |
        dotnet build --configuration Release --no-restore

    - name: 🗺️ Setup test database
      run: |
        dotnet ef database update --project src/ErpSystem.Data --startup-project src/ErpSystem.Api
      env:
        ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=ErpSystemTest;User Id=sa;Password=TestPassword123!;MultipleActiveResultSets=true;TrustServerCertificate=true;"

    - name: 🧠 Run unit tests
      run: |
        dotnet test --configuration Release --no-build --verbosity normal \
          --collect:"XPlat Code Coverage" \
          --results-directory ./coverage

    - name: 📊 Generate coverage report
      uses: danielpalme/ReportGenerator-GitHub-Action@5.1.26
      with:
        reports: 'src/coverage/**/coverage.cobertura.xml'
        targetdir: 'src/coverage/report'
        reporttypes: 'Html;Cobertura'

    - name: 📤 Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: src/coverage/report/Cobertura.xml
        fail_ci_if_error: false

    - name: 📦 Publish API artifacts
      run: |
        dotnet publish src/ErpSystem.Api/ErpSystem.Api.csproj \
          --configuration Release \
          --output ./publish/api \
          --no-restore

    - name: 🗺️ Test storage provider abstraction
      run: |
        # Test Local storage provider
        dotnet test --filter "Category=StorageProvider" --configuration Release --verbosity normal
        
        # Test with different storage configurations
        echo 'Testing Local storage provider...'
        dotnet test --filter "TestCategory=LocalStorage" --configuration Release || echo "Local storage tests completed"
        
        echo 'Testing Azure Blob mock provider...'
        dotnet test --filter "TestCategory=AzureBlobStorage" --configuration Release || echo "Azure storage tests completed"
        
        echo 'Testing file upload endpoints...'
        dotnet test --filter "TestCategory=FileUpload" --configuration Release || echo "File upload tests completed"
      env:
        ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=ErpSystemTest;User Id=sa;Password=TestPassword123!;MultipleActiveResultSets=true;TrustServerCertificate=true;"
        FileStorage__Provider: "Local"
        FileStorage__Local__BasePath: "test-uploads"
        FileStorage__Local__UseWebRoot: "false"

    - name: 📤 Upload API artifacts
      uses: actions/upload-artifact@v4
      with:
        name: api-artifacts
        path: ./publish/api/
        retention-days: 7

  # Job 3: Frontend Testing & Build
  frontend-build-test:
    name: 🖥️ Frontend Build & Test
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: 📦 Install dependencies
      run: |
        cd frontend
        npm ci

    - name: 🔍 Run ESLint
      run: |
        cd frontend
        npm run lint

    - name: 🎨 Check code formatting
      run: |
        cd frontend
        npm run format:check

    - name: 🧪 Run unit tests
      run: |
        cd frontend
        npm run test:ci

    - name: 🏗️ Build frontend
      run: |
        cd frontend
        npm run build
      env:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api

    - name: 📤 Upload frontend artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-artifacts
        path: frontend/.next/
        retention-days: 7

  # Job 4: Integration Tests
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-test]
    
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: TestPassword123!
          MSSQL_PID: Express
        ports:
          - 1433:1433

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: 📥 Download API artifacts
      uses: actions/download-artifact@v4
      with:
        name: api-artifacts
        path: ./api-build/

    - name: 📥 Download frontend artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-artifacts
        path: frontend/.next/

    - name: 🚀 Start API server
      run: |
        cd api-build
        nohup dotnet ErpSystem.Api.dll &
        sleep 30
      env:
        ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=ErpSystemIntegration;User Id=sa;Password=TestPassword123!;MultipleActiveResultSets=true;TrustServerCertificate=true;"
        ConnectionStrings__Redis: "localhost:6379"
        ASPNETCORE_ENVIRONMENT: "Development"
        ASPNETCORE_URLS: "http://localhost:5000"

    - name: 🖥️ Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: 🚀 Start frontend server
      run: |
        cd frontend
        nohup npm start &
        sleep 30
      env:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api

    - name: 🧪 Run integration tests
      run: |
        # Wait for services to be ready
        curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:5000/health
        curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:3000
        
        # Run API integration tests
        dotnet test --filter "Category=Integration" --verbosity normal
        
        # Run E2E tests (if available)
        cd frontend
        if [ -f "package.json" ] && grep -q "test:e2e" package.json; then
          npm run test:e2e
        fi

  # Job 5: Docker Build & Security Scan
  docker-build:
    name: 🐳 Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-test]
    
    strategy:
      matrix:
        service: [api, frontend]
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🔑 Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 📋 Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: 🏗️ Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ matrix.service == 'api' && 'src/ErpSystem.Api/Dockerfile' || 'frontend/Dockerfile' }}
        push: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: type=docker,dest=/tmp/${{ matrix.service }}-image.tar

    - name: 📤 Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-${{ matrix.service }}-image
        path: /tmp/${{ matrix.service }}-image.tar
        retention-days: 1

    - name: 🔒 Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        input: /tmp/${{ matrix.service }}-image.tar
        format: 'sarif'
        output: 'trivy-${{ matrix.service }}-results.sarif'

    - name: 📤 Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('trivy-${{ matrix.service }}-results.sarif') != ''
      continue-on-error: true
      with:
        sarif_file: 'trivy-${{ matrix.service }}-results.sarif'

  # Job 6: Deployment (Production)
  deploy-production:
    name: 🚢 Deploy to Production
    runs-on: ubuntu-latest
    needs: [integration-tests, docker-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📥 Download Docker images
      uses: actions/download-artifact@v4
      with:
        pattern: docker-*-image
        merge-multiple: true
        path: ./docker-images/

    - name: 🔑 Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 📤 Push Docker images
      run: |
        for image in ./docker-images/*.tar; do
          docker load -i "$image"
        done
        docker push --all-tags ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
        docker push --all-tags ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend

    - name: 🚢 Deploy to production server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.PROD_HOST }}
        username: ${{ secrets.PROD_USER }}
        key: ${{ secrets.PROD_SSH_KEY }}
        port: ${{ secrets.PROD_PORT || 22 }}
        script: |
          # Create deployment directory
          mkdir -p ~/erp-deployment
          cd ~/erp-deployment
          
          # Download latest docker-compose file
          curl -o docker-compose.monolith.yml https://raw.githubusercontent.com/${{ github.repository }}/master/docs/docker-compose.monolith.yml
          
          # Pull latest images
          docker-compose -f docker-compose.monolith.yml pull
          
          # Deploy with zero downtime
          docker-compose -f docker-compose.monolith.yml up -d
          
          # Health check
          sleep 30
          curl -f http://localhost/health || exit 1
          curl -f http://localhost/api/health || exit 1
          
          # Cleanup old images
          docker image prune -f

    - name: 📊 Slack deployment notification
      uses: 8398a7/action-slack@v3
      if: always() && secrets.SLACK_WEBHOOK != null
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
        text: |
          🚀 Production deployment ${{ job.status }}
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          
          ${{ job.status == 'success' && '✅ Deployment successful!' || '❌ Deployment failed!' }}

    - name: 📢 Teams deployment notification
      uses: skitionek/notify-microsoft-teams@master
      if: always() && secrets.TEAMS_WEBHOOK != null
      with:
        webhook_url: ${{ secrets.TEAMS_WEBHOOK }}
        needs: ${{ toJson(needs) }}
        job: ${{ toJson(job) }}
        steps: ${{ toJson(steps) }}
        dry_run: false

    - name: 📧 Email notification
      uses: dawidd6/action-send-mail@v3
      if: always() && secrets.EMAIL_HOST != null
      with:
        server_address: ${{ secrets.EMAIL_HOST }}
        server_port: ${{ secrets.EMAIL_PORT || '587' }}
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "ERP System - Production Deployment ${{ job.status }}"
        to: ${{ secrets.NOTIFICATION_EMAIL }}
        from: ${{ secrets.EMAIL_FROM || 'erp-system@noreply.com' }}
        html_body: |
          <h2>🚀 ERP System - Production Deployment Report</h2>
          
          <p><strong>Status:</strong> ${{ job.status == 'success' && '✅ Successful' || '❌ Failed' }}</p>
          <p><strong>Repository:</strong> ${{ github.repository }}</p>
          <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
          <p><strong>Commit:</strong> ${{ github.sha }}</p>
          <p><strong>Triggered by:</strong> ${{ github.actor }}</p>
          <p><strong>Workflow:</strong> ${{ github.workflow }}</p>
          
          <p><strong>Deployment URL:</strong> <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Details</a></p>
          
          ${{ job.status == 'success' && '<p style="color: green;">✅ The application has been successfully deployed to production!</p>' || '<p style="color: red;">❌ Deployment failed. Please check the logs and take appropriate action.</p>' }}

  # Staging deployment removed - using single branch workflow
