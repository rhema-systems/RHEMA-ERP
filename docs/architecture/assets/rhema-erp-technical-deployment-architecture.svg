<g text-anchor="middle" class="sideTitle"><text x="1425" y="190">SECURITY &amp; GOVERNANCE</text><text x="1425" y="359">EXTERNAL INTEGRATIONS</text><text x="1425" y="520">OBSERVABILITY</text><text x="1425" y="702">RESILIENCE &amp; OPERATIONS</text></g><g class="body"><text x="1310" y="220">• ASP.NET Identity + JWT</text><text x="1310" y="241">• Role and permission authorization</text><text x="1310" y="262">• Tenant-aware access controls</text><text x="1310" y="283">• Audit trail and rate limiting</text><text x="1310" y="304">• Secure upload validation</text><text x="1310" y="389">• Microsoft Graph / M365 email</text><text x="1310" y="410">• Email notification services</text><text x="1310" y="431">• Twilio-ready messaging support</text><text x="1310" y="452">• External partner portal APIs</text><text x="1310" y="550">• Serilog structured logging</text><text x="1310" y="571">• Fluentd → Elasticsearch → Kibana</text><text x="1310" y="592">• Prometheus metrics</text><text x="1310" y="613">• Grafana dashboards and alerts</text><text x="1310" y="634">• Health / ready / live endpoints</text><text x="1310" y="732">• Three frontend nodes + backup</text><text x="1310" y="753">• Three API nodes + backup</text><text x="1310" y="774">• Shared data-protection keys</text><text x="1310" y="795">• Persistent SQL / Redis volumes</text><text x="1310" y="816">• Secure file and upload volumes</text><text x="1310" y="837">• Restart and health-check policies</text></g>
