# Load balancer configuration for ERP System
upstream erp_backend {
    # Multiple API instances with health checks
    server erp-api-1:5000 weight=1 max_fails=3 fail_timeout=30s;
    server erp-api-2:5000 weight=1 max_fails=3 fail_timeout=30s;
    server erp-api-3:5000 weight=1 max_fails=3 fail_timeout=30s;
    
    # Backup server in case all primary fail
    server erp-api-backup:5000 backup;
    
    # Load balancing method (can be: round_robin, least_conn, ip_hash, hash)
    least_conn;
    
    # Keep connections alive
    keepalive 32;
}

upstream erp_frontend {
    # Multiple frontend instances  
    server erp-frontend-1:3000 weight=1 max_fails=3 fail_timeout=30s;
    server erp-frontend-2:3000 weight=1 max_fails=3 fail_timeout=30s;
    server erp-frontend-3:3000 weight=1 max_fails=3 fail_timeout=30s;
    
    # Backup server
    server erp-frontend-backup:3000 backup;
    
    # Use IP hash for sticky sessions if needed
    # ip_hash;
    
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=200r/m;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    listen [::]:80;
    server_name erp.company.com www.erp.company.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.company.com www.erp.company.com;

    # SSL Configuration
    ssl_certificate /etc/nginx/certs/erp.company.com.crt;
    ssl_certificate_key /etc/nginx/certs/erp.company.com.key;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    
    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss:; font-src 'self';" always;
    
    # Hide nginx version
    server_tokens off;
    
    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # Connection and rate limiting
    limit_conn conn_limit 50;
    limit_req zone=general_limit burst=20 nodelay;
    
    # Client settings
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    
    # API endpoints - load balanced to backend
    location /api/ {
        # Apply rate limiting for API endpoints
        limit_req zone=api_limit burst=10 nodelay;
        
        # Special rate limiting for authentication endpoints
        location ~ ^/api/auth/(login|refresh)$ {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://erp_backend;
            include /etc/nginx/proxy_params;
        }
        
        # Regular API endpoints
        proxy_pass http://erp_backend;
        include /etc/nginx/proxy_params;
        
        # CORS handling for API
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://erp.company.com' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            add_header 'Content-Type' 'text/plain; charset=utf-8' always;
            add_header 'Content-Length' 0 always;
            return 204;
        }
        
        add_header 'Access-Control-Allow-Origin' 'https://erp.company.com' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }
    
    # Health check endpoints
    location /health {
        proxy_pass http://erp_backend;
        include /etc/nginx/proxy_params;
        
        # Don't apply rate limiting to health checks
        limit_req off;
        limit_conn off;
        
        # Internal health check (faster timeout)
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        
        # Health check specific headers
        proxy_set_header Host $host;
        proxy_set_header X-Health-Check "true";
    }
    
    # Swagger/OpenAPI documentation
    location /swagger/ {
        proxy_pass http://erp_backend;
        include /etc/nginx/proxy_params;
        
        # Allow iframe for Swagger UI
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    
    # Static files and frontend assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://erp_frontend;
        include /etc/nginx/proxy_params;
        
        # Cache static assets
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Remove rate limiting for static assets
        limit_req off;
    }
    
    # WebSocket connections for real-time features
    location /ws/ {
        proxy_pass http://erp_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket specific timeouts
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        
        # No rate limiting for WebSocket connections
        limit_req off;
    }
    
    # Frontend application - catch-all for SPA routing
    location / {
        proxy_pass http://erp_frontend;
        include /etc/nginx/proxy_params;
        
        # Handle SPA routing
        try_files $uri $uri/ @fallback;
    }
    
    # Fallback for SPA routing
    location @fallback {
        proxy_pass http://erp_frontend;
        include /etc/nginx/proxy_params;
    }
    
    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/html;
    }
    
    # Monitoring endpoint for nginx stats
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
    }
}

# Monitoring and admin interface (internal only)
server {
    listen 8080;
    server_name localhost;
    
    # Internal monitoring endpoints
    location /status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
    }
    
    # Upstream status
    location /upstream {
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;  
        deny all;
        
        # Custom upstream status (would require additional nginx modules)
        return 200 "Upstream status endpoint";
        add_header Content-Type text/plain;
    }
}