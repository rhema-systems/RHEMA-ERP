<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>API Connection Test</h1>
    <button onclick="testAPI()">Test Quality Checklists API</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                console.log('Testing API at: http://localhost:5000/api/quality-checklists');
                
                const response = await fetch('http://localhost:5000/api/quality-checklists', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <h2>✅ SUCCESS</h2>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Data count:</strong> ${data.length}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h2>❌ HTTP ERROR</h2>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Status Text:</strong> ${response.statusText}</p>
                    `;
                }
            } catch (error) {
                console.error('Fetch error:', error);
                resultDiv.innerHTML = `
                    <h2>❌ NETWORK ERROR</h2>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p>This is likely a CORS or connectivity issue.</p>
                `;
            }
        }
    </script>
</body>
</html>
